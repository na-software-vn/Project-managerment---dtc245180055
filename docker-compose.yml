services:
  pm_postgres:
    image: postgres:16-alpine
    container_name: pm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-project_manager_db}
      POSTGRES_USER: ${DB_USER:-pm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pm_postgres_data:/var/lib/postgresql/data
      - ./sql/schema_pg.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pm_user} -d ${DB_NAME:-project_manager_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pm_pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pm_pgadmin
    restart: unless-stopped
    depends_on:
      - pm_postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-Admin_Pgadmin_Secur3_2026}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      SCRIPT_NAME: /pgadmin
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pm_pgadmin_data:/var/lib/pgadmin
    networks:
      - frontend_net
      - backend_net

  pm_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pm_app
    restart: unless-stopped
    depends_on:
      pm_postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: pm_postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-pm_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-project_manager_db}
      SESSION_SECRET: ${SESSION_SECRET}
    ports:
      - "5000:5000"
    volumes:
      - .:/usr/src/app
    networks:
      - frontend_net
      - backend_net
      - monitoring_net

  pm_nginx:
    image: nginx:alpine
    container_name: pm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - pm_app
    networks:
      - frontend_net

  # ==========================================
  # HỆ THỐNG GIÁM SÁT (PROMETHEUS + GRAFANA)
  # ==========================================

  # 1. Prometheus Server (Thu thập số liệu định kỳ)
  pm_prometheus:
    image: prom/prometheus:latest
    container_name: pm_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - pm_prometheus_data:/prometheus
    networks:
      - monitoring_net

  # 2. Grafana Dashboard (Giao diện trực quan hóa đồ thị)
  pm_grafana:
    image: grafana/grafana:latest
    container_name: pm_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - pm_grafana_data:/var/lib/grafana
    depends_on:
      - pm_prometheus
    networks:
      - monitoring_net

  # 3. cAdvisor (Giám sát chỉ số CPU/RAM/Mạng của toàn bộ Container)
  pm_cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: pm_cadvisor
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - monitoring_net

  # 4. PostgreSQL Exporter (Giám sát Database: Truy vấn, kết nối, transactions)
  pm_postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: pm_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-pm_user}:${DB_PASSWORD}@pm_postgres:5432/${DB_NAME:-project_manager_db}?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      pm_postgres:
        condition: service_healthy
    networks:
      - backend_net
      - monitoring_net

  # 5. Node Exporter (Giám sát Phần cứng máy chủ Host: CPU, RAM, Disk cho Dashboard 1860)
  pm_node_exporter:
    image: prom/node-exporter:latest
    container_name: pm_node_exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - monitoring_net

  # ==========================================
  # HỆ THỐNG LOG TẬP TRUNG (LOKI + PROMTAIL)
  # ==========================================

  # 6. Loki Server (Lưu trữ và lập chỉ mục Log)
  pm_loki:
    image: grafana/loki:latest
    container_name: pm_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yaml
      - pm_loki_data:/loki
    command:
      - -config.file=/etc/loki/loki-config.yaml
    networks:
      - monitoring_net

  # 7. Promtail (Thu thập log Docker và đẩy vào Loki)
  pm_promtail:
    image: grafana/promtail:latest
    container_name: pm_promtail
    restart: unless-stopped
    ports:
      - "9080:9080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command:
      - -config.file=/etc/promtail/config.yml
    depends_on:
      - pm_loki
    networks:
      - monitoring_net

volumes:
  pm_postgres_data:
  pm_pgadmin_data:
  pm_prometheus_data:
  pm_grafana_data:
  pm_loki_data:

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  monitoring_net:
    driver: bridge
