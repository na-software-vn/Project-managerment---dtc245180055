services:
  pm_mysql:
    image: mysql:8.0
    container_name: pm_mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: project_manager_db
      MYSQL_USER: pm_user
      MYSQL_PASSWORD: pm_password
    ports:
      - "3306:3306"
    volumes:
      - pm_mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - pm_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  pm_phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: pm_phpmyadmin
    restart: unless-stopped
    depends_on:
      - pm_mysql
    environment:
      PMA_HOST: pm_mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
      UPLOAD_LIMIT: 64M
    ports:
      - "8085:80"
    networks:
      - pm_network

  pm_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pm_app
    restart: unless-stopped
    depends_on:
      pm_mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: pm_mysql
      DB_PORT: 3306
      DB_USER: pm_user
      DB_PASSWORD: pm_password
      DB_NAME: project_manager_db
      SESSION_SECRET: pm_secret_dtc245180055_production
    ports:
      - "5000:5000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - pm_network

  pm_nginx:
    image: nginx:alpine
    container_name: pm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - pm_app
    networks:
      - pm_network

volumes:
  pm_mysql_data:

networks:
  pm_network:
    driver: bridge
