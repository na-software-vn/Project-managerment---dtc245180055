# Ẩn phiên bản Nginx toàn cục
server_tokens off;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Chuyển hướng toàn bộ HTTP sang HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # Ẩn phiên bản Nginx
    server_tokens off;

    # SSL Certificate & Private Key
    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    # SSL Protocols & Cipher Suites (Chỉ dùng TLSv1.2 và TLSv1.3 bảo mật cao)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ==========================================
    # SECURITY HEADERS
    # ==========================================
    # 1. Chống Clickjacking: Ngăn chặn nhúng trang web vào iframe giả mạo
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 2. Chống MIME Confusion: Buộc trình duyệt tuân thủ đúng Content-Type, không tự đoán file
    add_header X-Content-Type-Options "nosniff" always;

    # 3. Kích hoạt bộ lọc XSS của trình duyệt
    add_header X-XSS-Protection "1; mode=block" always;

    # 4. Bảo vệ thông tin nhạy cảm trong Header Referer
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 5. Ép trình duyệt luôn giao tiếp qua HTTPS an toàn (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 6. Content-Security-Policy (CSP): Ngăn chặn Cross-Site Scripting (XSS) và chèn mã độc
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data: https:; connect-src 'self';" always;

    # 7. Permissions-Policy: Hạn chế các tính năng phần cứng trình duyệt không cần thiết
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # 8. Chặn tải dữ liệu chéo domain từ file Flash/PDF độc hại
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # ==========================================
    # THIẾT LẬP REVERSE PROXY & CHE GIẤU NỀN TẢNG
    # ==========================================
    # Ẩn header lộ thông tin công nghệ backend (Express, PHP)
    proxy_hide_header X-Powered-By;

    # Reverse Proxy cho phpMyAdmin qua HTTPS: https://localhost/phpmyadmin/
    location /phpmyadmin/ {
        proxy_pass http://pm_phpmyadmin:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Reverse Proxy đến Express App (Node.js)
    location / {
        proxy_pass http://pm_app:5000;
        proxy_http_version 1.1;

        # Forward Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffer & Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
